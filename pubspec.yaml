name: galarm_enhanced
description: G-Alarm Enhanced (PulseRing) - Social Alarm Clock, Group Events & Reminders.
publish_to: "none"
version: 1.3.1+2

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.19.0

  # State management
  flutter_riverpod: ^2.5.1

  # Local offline-first SQLite DB (Drift)
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.3
  path: ^1.9.0

  # Firebase
  firebase_core: ^3.3.0
  firebase_auth: ^5.1.4
  cloud_firestore: ^5.2.1
  firebase_storage: ^12.1.3
  firebase_messaging: ^15.0.4

  # Notifications & Timezone
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.4
  flutter_timezone: ^2.1.0

  # Contacts, Media, Audio & Utilities
  flutter_contacts: ^1.1.9+2
  file_picker: ^8.0.6
  image_picker: ^1.1.2
  audioplayers: ^6.0.0
  crypto: ^3.0.3
  uuid: ^4.4.2
  shared_preferences: ^2.3.1
  url_launcher: ^6.3.0
  connectivity_plus: ^6.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  drift_dev: ^2.18.0
  build_runner: ^2.4.11

flutter:
  uses-material-design: true
  generate: true
