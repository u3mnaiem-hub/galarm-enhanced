name: Build Android APK (U3m Alarm)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build_apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.0"
          channel: "stable"

      - name: Scaffold Flutter Android Gradle wrapper around project sources
        run: |
          mkdir -p /tmp/custom_backup
          cp -r lib pubspec.yaml l10n.yaml test android /tmp/custom_backup/
          flutter create . --project-name galarm_enhanced --org com.galarmenhanced --platforms android
          cp /tmp/custom_backup/pubspec.yaml .
          cp /tmp/custom_backup/l10n.yaml .
          rm -rf lib test
          cp -r /tmp/custom_backup/lib .
          cp -r /tmp/custom_backup/test .
          rm -rf android/app/src/main/kotlin/com/galarmenhanced/galarm_enhanced
          rm -rf android/app/src/main/res/mipmap-anydpi*
          cp -r /tmp/custom_backup/android/app/src/main/* android/app/src/main/
          if [ -f android/app/build.gradle ]; then
            sed -i 's/namespace = .*/namespace = "com.galarmenhanced.app"/g' android/app/build.gradle
            sed -i 's/applicationId = .*/applicationId = "com.galarmenhanced.app"/g' android/app/build.gradle
            sed -i 's/minSdkVersion .*/minSdkVersion 26/g' android/app/build.gradle
            sed -i 's/minSdk = .*/minSdk = 26/g' android/app/build.gradle
            sed -i 's/compileSdk = .*/compileSdk = 35/g' android/app/build.gradle
            sed -i 's/targetSdk = .*/targetSdk = 35/g' android/app/build.gradle
            printf '\nandroid {\n    compileOptions {\n        coreLibraryDesugaringEnabled true\n    }\n}\n\ndependencies {\n    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.0.4"\n}\n' >> android/app/build.gradle
          fi
          if [ -f android/settings.gradle ]; then
            sed -i 's/id "com.android.application" version "[^"]*"/id "com.android.application" version "8.5.2"/g' android/settings.gradle
            sed -i 's/id "org.jetbrains.kotlin.android" version "[^"]*"/id "org.jetbrains.kotlin.android" version "2.0.21"/g' android/settings.gradle
          fi
          if [ -f android/gradle/wrapper/gradle-wrapper.properties ]; then
            sed -i 's|distributionUrl=.*|distributionUrl=https\\://services.gradle.org/distributions/gradle-8.7-all.zip|g' android/gradle/wrapper/gradle-wrapper.properties
          fi

      - name: Install dependencies & generate Drift code
        run: |
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs

      - name: Build Release APK
        run: |
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk "build/app/outputs/flutter-apk/U3m Alarm.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: U3m Alarm
          path: build/app/outputs/flutter-apk/U3m Alarm.apk
